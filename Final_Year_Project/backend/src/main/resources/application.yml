server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: java-fullstack-interview-prep
  
  datasource:
    url: ${DB_URL:jdbc:h2:mem:interview_prep_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
 
# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000 # 24 hours in milliseconds

# JDoodle API Configuration
jdoodle:
  client-id: ${JDOODLE_CLIENT_ID:}
  client-secret: ${JDOODLE_CLIENT_SECRET:}
  api-url: https://api.jdoodle.com/v1/execute

# CORS Configuration
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000
  allowed-origin-patterns: https://*.vercel.app

# App: Gemini call settings
app:
  gemini:
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:10}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-1.5-flash}

# Logging
logging:
  level:
    com.interviewprep: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
