# Role-Based AI Interview Preparation - Application Configuration
# Copy to application-local.yml and override for local development

spring:
  application:
    name: role-based-ai-interview

  datasource:
    url: jdbc:mysql://localhost:3306/ai_interview_prep?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

# Spring AI - Grok (xAI) configuration
spring.ai:
  grok:
    base-url: ${GROK_BASE_URL:https://api.grok.x.ai}
    endpoint: ${GROK_ENDPOINT:/v1/generate}
    api-key: ${GROK_API_KEY:}
    model: ${GROK_MODEL:grokxai}
    chat:
      temperature: ${GROK_TEMPERATURE:0.7}

# App config: JWT, JDoodle, CORS
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-must-be-at-least-32-chars}
    expiration-ms: 86400000  # 24 hours
  jdoodle:
    client-id: ${JDOODLE_CLIENT_ID:}
    client-secret: ${JDOODLE_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

# Server
server:
  port: 8080
  servlet:
    context-path: /api

# CORS is handled in WebConfig; frontend typically runs on port 5173 (Vite)
