services:
  - type: web
    name: fourth-year-backend
    env: docker
    rootDir: Final_Year_Project/backend
    dockerfilePath: Final_Year_Project/backend/Dockerfile
    autoDeploy: true
    healthCheckPath: /api/actuator/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com
      - key: GEMINI_TIMEOUT_SECONDS
        value: "10"
      - key: GEMINI_MAX_RETRIES
        value: "2"
      - key: JWT_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: org.postgresql.Driver
